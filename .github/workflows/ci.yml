# Tests and builds every push. A tag `X.Y.Z` (the manifest's version, no
# "v") makes a GitHub release with the files Barynt installs and prints the
# hash for your plugins.json.
name: CI

on:
  push:
    branches: [main]
    tags: ["[0-9]+.[0-9]+.[0-9]+*"]
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          path: plugin
      # The SDK isn't on npm yet: it comes from Barynt's repository, next
      # to the plugin as package.json expects (`file:../barynt/…`). A branch
      # of the same name there wins — a change made in both repositories
      # builds against its own SDK; else the repository variable BARYNT_REF,
      # else main.
      - name: Pick Barynt's branch
        id: barynt
        env:
          BRANCH: ${{ github.head_ref || github.ref_name }}
          FALLBACK: ${{ vars.BARYNT_REF || 'main' }}
        run: |
          if git ls-remote --exit-code --heads https://github.com/barynt-dev/barynt-web.git "$BRANCH" >/dev/null; then
            echo "ref=$BRANCH" >> "$GITHUB_OUTPUT"
          else
            echo "ref=$FALLBACK" >> "$GITHUB_OUTPUT"
          fi
          echo "Barynt at: $(grep ref= "$GITHUB_OUTPUT" | tail -1)"
      - uses: actions/checkout@v5
        with:
          repository: barynt-dev/barynt-web
          ref: ${{ steps.barynt.outputs.ref }}
          path: barynt
          sparse-checkout: packages/plugin-sdk
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3
      - name: Build the SDK
        working-directory: barynt/packages/plugin-sdk
        run: bun install && bun run build
      - name: Install
        working-directory: plugin
        run: bun install
      - name: Lint
        working-directory: plugin
        run: bun run lint
      - name: Typecheck
        working-directory: plugin
        run: bun run typecheck
      - name: Test
        working-directory: plugin
        run: bun run test
      - name: Build
        working-directory: plugin
        run: bun run build

      - name: Release
        if: startsWith(github.ref, 'refs/tags/')
        working-directory: plugin
        env:
          GH_TOKEN: ${{ github.token }}
          PLUGIN_REPO: ${{ github.server_url }}/${{ github.repository }}
        run: |
          test "$(jq -r .version manifest.json)" = "$GITHUB_REF_NAME" \
            || { echo "The tag must be the manifest's version"; exit 1; }
          bun scripts/release.ts | tee release.txt
          # A version with a pre-release part (`0.1.0-beta.1`) is a pre-release.
          case "$GITHUB_REF_NAME" in *-*) PRE=--prerelease ;; *) PRE= ;; esac
          gh release create "$GITHUB_REF_NAME" release/"$GITHUB_REF_NAME"/* \
            --title "$GITHUB_REF_NAME" --notes-file release.txt $PRE
